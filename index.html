<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano di Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E9ECEC;
    --paper-line: #C9D1D3;
    --card: #FCFDFC;
    --ink: #1F2A44;
    --ink-soft: #56607A;
    --highlighter: #FFD23F;
    --highlighter-soft: #FFF1BE;
    --coral: #E1583F;
    --green: #3F8F5F;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, transparent, transparent 27px, var(--paper-line) 28px),
      var(--paper);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding:20px 16px 60px;
    min-height:100vh;
  }
  .wrap{max-width:720px;margin:0 auto;}

  /* Header */
  header{margin-bottom:22px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:4px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:34px;
    margin:0 0 2px;
    letter-spacing:-.01em;
  }
  .week-range{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-soft);}

  /* Day tabs — index-card style */
  .day-tabs{
    display:flex;
    gap:0;
    margin:22px 0 0;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto;
    min-width:52px;
    padding:10px 6px 12px;
    text-align:center;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    margin-right:3px;
    transform:translateY(6px);
    transition:transform .15s ease, background .15s ease;
    position:relative;
  }
  .day-tab .dow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);display:block;}
  .day-tab .dom{font-family:'Fraunces',serif;font-weight:600;font-size:18px;display:block;margin-top:2px;}
  .day-tab.active{
    background:var(--ink);
    transform:translateY(0);
    z-index:2;
    box-shadow:0 -2px 10px rgba(31,42,68,.18);
  }
  .day-tab.active .dow, .day-tab.active .dom{color:#fff;}
  .day-tab.today:not(.active)::after{
    content:'';
    position:absolute; top:6px; right:6px;
    width:5px;height:5px;border-radius:50%;background:var(--coral);
  }
  .ring-mini{margin:4px auto 0;display:block;}

  /* Card panel under tabs */
  .panel{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:0 10px 10px 10px;
    padding:18px 16px;
    box-shadow:0 -1px 0 var(--ink);
  }

  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .panel-head h2{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin:0;}
  .goal-line{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);}

  /* Progress ring big */
  .progress-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .ring-wrap{flex:0 0 auto;}
  .progress-text{font-size:13px;color:var(--ink-soft);line-height:1.4;}
  .progress-text b{color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:700;}

  /* Task list */
  .task{
    display:flex;align-items:flex-start;gap:10px;
    padding:11px 4px;
    border-bottom:1px dashed var(--paper-line);
  }
  .task:last-child{border-bottom:none;}
  .task .check{
    flex:0 0 auto;width:19px;height:19px;border-radius:5px;
    border:1.5px solid var(--ink-soft);margin-top:2px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:#fff;
  }
  .task.done .check{background:var(--green);border-color:var(--green);}
  .task.done .check::after{content:'✓';color:#fff;font-size:12px;font-weight:700;}
  .task-body{flex:1;min-width:0;}
  .task-title{font-size:14.5px;font-weight:500;word-break:break-word;}
  .task.done .task-title{text-decoration:line-through;color:var(--ink-soft);}
  .task-meta{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap;}
  .tag{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;
    padding:2px 7px;border-radius:20px;color:#fff;
  }
  .dur{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);}
  .task .del{
    flex:0 0 auto;background:none;border:none;color:var(--ink-soft);
    font-size:17px;cursor:pointer;padding:2px 4px;line-height:1;
  }
  .empty{
    text-align:center;padding:22px 10px;color:var(--ink-soft);font-size:13.5px;
  }
  .empty span{display:block;font-family:'Fraunces',serif;font-size:15px;color:var(--ink);margin-bottom:3px;}

  /* Add task form */
  .add-form{
    display:flex;flex-direction:column;gap:8px;
    margin-top:14px;padding-top:14px;border-top:1px solid var(--paper-line);
  }
  .add-row{display:flex;gap:8px;}
  input[type=text], select, input[type=number]{
    font-family:'Inter',sans-serif;font-size:14px;
    border:1.5px solid var(--paper-line);border-radius:7px;
    padding:9px 10px;background:#fff;color:var(--ink);width:100%;
  }
  input[type=text]:focus, select:focus, input[type=number]:focus{outline:2px solid var(--ink);outline-offset:1px;}
  select{max-width:130px;flex:0 0 auto;}
  input[type=number]{max-width:80px;flex:0 0 auto;}
  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
    border:none;border-radius:7px;padding:10px 14px;cursor:pointer;
    background:var(--ink);color:#fff;
  }
  .btn:active{transform:translateY(1px);}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--paper-line);}
  .btn.full{width:100%;}
  .btn:focus-visible, select:focus-visible, input:focus-visible, .day-tab:focus-visible, .task .check:focus-visible{
    outline:2px solid var(--ink);outline-offset:2px;
  }

  /* Sections below */
  section.block{margin-top:22px;}
  section.block h2{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin:0 0 10px;}

  /* Subjects manager */
  .subject-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .subject-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--card);border:1px solid var(--paper-line);
    border-radius:20px;padding:6px 10px 6px 8px;font-size:13px;
  }
  .swatch{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
  .subject-chip button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:0;margin-left:2px;}
  .subject-form{display:flex;gap:8px;align-items:center;}
  input[type=color]{width:38px;height:38px;border:1.5px solid var(--paper-line);border-radius:7px;padding:2px;background:#fff;cursor:pointer;flex:0 0 auto;}

  /* Timer */
  .timer-card{
    background:var(--ink);color:#fff;border-radius:10px;padding:18px 16px;
  }
  .timer-card h2{color:#fff;}
  .timer-display{
    font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;
    letter-spacing:-.02em;text-align:center;margin:8px 0 14px;
  }
  .timer-controls{display:flex;gap:8px;}
  .timer-controls .btn{flex:1;background:rgba(255,255,255,.12);color:#fff;}
  .timer-controls .btn.primary{background:var(--highlighter);color:var(--ink);}
  .timer-sub{display:flex;gap:8px;margin-bottom:12px;}
  .timer-sub select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff;}
  .timer-sub select option{color:#000;}

  footer{
    text-align:center;margin-top:28px;font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--ink-soft);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">quaderno di studio</div>
    <h1>Piano di Studio</h1>
    <div class="week-range" id="weekRange"></div>
  </header>

  <div class="day-tabs" id="dayTabs"></div>
  <div class="panel">
    <div class="panel-head">
      <h2 id="panelDate"></h2>
      <div class="goal-line" id="goalLine"></div>
    </div>

    <div class="progress-row">
      <div class="ring-wrap" id="bigRing"></div>
      <div class="progress-text" id="progressText"></div>
    </div>

    <div id="taskList"></div>

    <div class="add-form">
      <input type="text" id="taskTitle" placeholder="Cosa devi studiare?">
      <div class="add-row">
        <select id="taskSubject"></select>
        <input type="number" id="taskDuration" placeholder="min" min="5" step="5" value="30">
        <button class="btn full" id="addTaskBtn" style="flex:1;">Aggiungi</button>
      </div>
    </div>
  </div>

  <section class="block">
    <h2>Materie</h2>
    <div class="subject-list" id="subjectList"></div>
    <div class="subject-form">
      <input type="color" id="subjectColor" value="#3F8F5F">
      <input type="text" id="subjectName" placeholder="Nome materia">
      <input type="number" id="subjectGoal" placeholder="min/sett." min="30" step="30" value="180" style="max-width:100px;">
      <button class="btn" id="addSubjectBtn">+</button>
    </div>
  </section>

  <section class="block">
    <h2>Sessione di concentrazione</h2>
    <div class="timer-card">
      <div class="timer-sub">
        <select id="timerSubject" style="flex:1;max-width:none;"></select>
      </div>
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="timer-controls">
        <button class="btn primary" id="timerStartPause">Avvia</button>
        <button class="btn" id="timerReset">Azzera</button>
        <button class="btn" id="timerSave">Salva</button>
      </div>
    </div>
  </section>

  <footer>i dati restano salvati su questo dispositivo</footer>
</div>

<script>
const STORE_KEY = 'study-planner-data';
let data = { subjects: [], tasks: [] };
let selectedDateISO = null;
let timerSeconds = 0, timerRunning = false, timerInterval = null;

const DOW = ['LUN','MAR','MER','GIO','VEN','SAB','DOM'];
const MONTHS = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];

function toISO(d){ const dt=new Date(d); dt.setHours(0,0,0,0); return dt.toISOString().slice(0,10); }
function fromISO(iso){ return new Date(iso+'T00:00:00'); }
function todayISO(){ return toISO(new Date()); }

function mondayOf(iso){
  const d = fromISO(iso);
  const day = (d.getDay()+6)%7; // 0=Mon
  d.setDate(d.getDate()-day);
  return toISO(d);
}
function weekDates(iso){
  const start = fromISO(mondayOf(iso));
  const out=[];
  for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); out.push(toISO(d)); }
  return out;
}

async function loadData(){
  try{
    const res = await window.storage.get(STORE_KEY, false);
    if(res && res.value){ data = JSON.parse(res.value); }
  }catch(e){ /* no data yet */ }
  if(!data.subjects) data.subjects=[];
  if(!data.tasks) data.tasks=[];
  if(data.subjects.length===0){
    data.subjects = [
      {id:'s1', name:'Matematica', color:'#3F8F5F', goal:180},
      {id:'s2', name:'Inglese', color:'#E1583F', goal:120}
    ];
    await saveData();
  }
}
let saveTimeout=null;
function saveData(){
  return new Promise((resolve)=>{
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(async ()=>{
      try{ await window.storage.set(STORE_KEY, JSON.stringify(data), false); }
      catch(e){ console.error('Errore salvataggio', e); }
      resolve();
    }, 150);
  });
}

function uid(){ return 'id'+Date.now()+Math.random().toString(36).slice(2,7); }

function subjectById(id){ return data.subjects.find(s=>s.id===id); }

function minutesForDate(iso){
  return data.tasks.filter(t=>t.date===iso && t.done).reduce((sum,t)=>sum+Number(t.duration||0),0);
}
function minutesPerSubjectWeek(subjectId, weekISOs){
  return data.tasks
    .filter(t=>t.subjectId===subjectId && weekISOs.includes(t.date) && t.done)
    .reduce((sum,t)=>sum+Number(t.duration||0),0);
}
function dayGoalTotal(iso){
  // sum of (weeklyGoal/7) for subjects that have a task that day, fallback: total weekly goal / 7 across all subjects
  const totalWeekly = data.subjects.reduce((s,x)=>s+Number(x.goal||0),0);
  return Math.round(totalWeekly/7) || 60;
}

function ringSVG(pct, size, stroke, colorDone){
  pct = Math.max(0, Math.min(1, pct));
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  const offset = c*(1-pct);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--paper-line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colorDone}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

function renderWeekRange(){
  const dates = weekDates(selectedDateISO);
  const first = fromISO(dates[0]), last = fromISO(dates[6]);
  document.getElementById('weekRange').textContent =
    `${first.getDate()} ${MONTHS[first.getMonth()]} — ${last.getDate()} ${MONTHS[last.getMonth()]} ${last.getFullYear()}`;
}

function renderDayTabs(){
  const dates = weekDates(selectedDateISO);
  const tabs = document.getElementById('dayTabs');
  tabs.innerHTML='';
  const t = todayISO();
  dates.forEach((iso, i)=>{
    const d = fromISO(iso);
    const goal = dayGoalTotal(iso);
    const done = minutesForDate(iso);
    const pct = goal ? done/goal : 0;
    const el = document.createElement('div');
    el.className = 'day-tab' + (iso===selectedDateISO?' active':'') + (iso===t?' today':'');
    el.tabIndex = 0;
    el.innerHTML = `<span class="dow">${DOW[i]}</span><span class="dom">${d.getDate()}</span>
      <span class="ring-mini">${ringSVG(pct, 20, 3, iso===selectedDateISO?'var(--highlighter)':'var(--green)')}</span>`;
    el.addEventListener('click', ()=>{ selectedDateISO = iso; renderAll(); });
    tabs.appendChild(el);
  });
}

function renderPanel(){
  const d = fromISO(selectedDateISO);
  const isToday = selectedDateISO===todayISO();
  document.getElementById('panelDate').textContent =
    `${DOW[(d.getDay()+6)%7].charAt(0)+DOW[(d.getDay()+6)%7].slice(1).toLowerCase()} ${d.getDate()} ${MONTHS[d.getMonth()]}` + (isToday? ' · oggi':'');

  const goal = dayGoalTotal(selectedDateISO);
  const done = minutesForDate(selectedDateISO);
  document.getElementById('goalLine').textContent = `obiettivo ${goal} min`;
  document.getElementById('bigRing').innerHTML = ringSVG(goal? done/goal:0, 56, 6, 'var(--ink)');
  const remaining = Math.max(0, goal-done);
  document.getElementById('progressText').innerHTML =
    `<b>${done}</b> min studiati su <b>${goal}</b> min &middot; ${remaining>0? `mancano <b>${remaining}</b> min` : 'obiettivo raggiunto'}`;

  const list = document.getElementById('taskList');
  const dayTasks = data.tasks.filter(t=>t.date===selectedDateISO).sort((a,b)=> (a.done===b.done)?0:(a.done?1:-1));
  if(dayTasks.length===0){
    list.innerHTML = `<div class="empty"><span>Pagina bianca</span>Aggiungi cosa vuoi studiare oggi.</div>`;
  } else {
    list.innerHTML = dayTasks.map(t=>{
      const subj = subjectById(t.subjectId);
      const color = subj? subj.color : '#888';
      const name = subj? subj.name : '—';
      return `<div class="task ${t.done?'done':''}" data-id="${t.id}">
        <div class="check" role="checkbox" aria-checked="${t.done}" tabindex="0"></div>
        <div class="task-body">
          <div class="task-title">${escapeHTML(t.title)}</div>
          <div class="task-meta">
            <span class="tag" style="background:${color}">${escapeHTML(name)}</span>
            <span class="dur">${t.duration} min</span>
          </div>
        </div>
        <button class="del" aria-label="Elimina">×</button>
      </div>`;
    }).join('');
  }

  // hook up events
  list.querySelectorAll('.task').forEach(row=>{
    const id = row.dataset.id;
    row.querySelector('.check').addEventListener('click', ()=>toggleTask(id));
    row.querySelector('.del').addEventListener('click', ()=>deleteTask(id));
  });
}

function escapeHTML(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function toggleTask(id){
  const t = data.tasks.find(x=>x.id===id);
  if(!t) return;
  t.done = !t.done;
  await saveData();
  renderAll();
}
async function deleteTask(id){
  data.tasks = data.tasks.filter(x=>x.id!==id);
  await saveData();
  renderAll();
}

function renderSubjectSelects(){
  const opts = data.subjects.map(s=>`<option value="${s.id}">${escapeHTML(s.name)}</option>`).join('');
  document.getElementById('taskSubject').innerHTML = opts || '<option value="">Nessuna materia</option>';
  document.getElementById('timerSubject').innerHTML = opts || '<option value="">Nessuna materia</option>';
}

function renderSubjectList(){
  const wrap = document.getElementById('subjectList');
  if(data.subjects.length===0){
    wrap.innerHTML = `<div class="empty" style="padding:8px 0;">Nessuna materia ancora.</div>`;
    return;
  }
  const weekISOs = weekDates(selectedDateISO);
  wrap.innerHTML = data.subjects.map(s=>{
    const mins = minutesPerSubjectWeek(s.id, weekISOs);
    return `<div class="subject-chip">
      <span class="swatch" style="background:${s.color}"></span>
      ${escapeHTML(s.name)} · ${mins}/${s.goal} min
      <button data-id="${s.id}" aria-label="Elimina materia">×</button>
    </div>`;
  }).join('');
  wrap.querySelectorAll('button[data-id]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      data.subjects = data.subjects.filter(s=>s.id!==id);
      data.tasks = data.tasks.filter(t=>t.subjectId!==id);
      await saveData();
      renderAll();
    });
  });
}

function renderAll(){
  renderWeekRange();
  renderDayTabs();
  renderPanel();
  renderSubjectSelects();
  renderSubjectList();
}

// --- Add task ---
document.getElementById('addTaskBtn').addEventListener('click', async ()=>{
  const title = document.getElementById('taskTitle').value.trim();
  const subjectId = document.getElementById('taskSubject').value;
  const duration = Number(document.getElementById('taskDuration').value) || 30;
  if(!title){ return; }
  data.tasks.push({ id:uid(), title, subjectId, duration, date:selectedDateISO, done:false });
  document.getElementById('taskTitle').value='';
  await saveData();
  renderAll();
});
document.getElementById('taskTitle').addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){ document.getElementById('addTaskBtn').click(); }
});

// --- Add subject ---
document.getElementById('addSubjectBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('subjectName').value.trim();
  const color = document.getElementById('subjectColor').value;
  const goal = Number(document.getElementById('subjectGoal').value) || 180;
  if(!name) return;
  data.subjects.push({ id:uid(), name, color, goal });
  document.getElementById('subjectName').value='';
  await saveData();
  renderAll();
});

// --- Timer ---
function formatTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}
function updateTimerDisplay(){ document.getElementById('timerDisplay').textContent = formatTime(timerSeconds); }

document.getElementById('timerStartPause').addEventListener('click', (e)=>{
  timerRunning = !timerRunning;
  e.target.textContent = timerRunning? 'Pausa':'Avvia';
  if(timerRunning){
    timerInterval = setInterval(()=>{ timerSeconds++; updateTimerDisplay(); }, 1000);
  } else {
    clearInterval(timerInterval);
  }
});
document.getElementById('timerReset').addEventListener('click', ()=>{
  timerRunning=false; clearInterval(timerInterval); timerSeconds=0; updateTimerDisplay();
  document.getElementById('timerStartPause').textContent='Avvia';
});
document.getElementById('timerSave').addEventListener('click', async ()=>{
  const minutes = Math.round(timerSeconds/60);
  const subjectId = document.getElementById('timerSubject').value;
  if(minutes<1 || !subjectId){ return; }
  data.tasks.push({
    id:uid(), title:'Sessione di concentrazione', subjectId,
    duration:minutes, date:selectedDateISO, done:true
  });
  await saveData();
  timerRunning=false; clearInterval(timerInterval); timerSeconds=0; updateTimerDisplay();
  document.getElementById('timerStartPause').textContent='Avvia';
  renderAll();
});

// --- Init ---
(async function init(){
  selectedDateISO = todayISO();
  await loadData();
  renderAll();
})();
</script>
</body>
</html>
